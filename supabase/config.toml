project_id = "mando"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# These functions explicitly validate bearer tokens with auth.getUser().
# This also supports Supabase's newer asymmetric signing keys.
[functions.ai-message]
verify_jwt = false
[functions.ai-news]
verify_jwt = false
[functions.ai-staff]
verify_jwt = false
[functions.ai-manager-avatar]
verify_jwt = false
